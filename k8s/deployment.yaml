apiVersion: apps/v1
kind: Deployment

metadata:
  name: status-monitor

spec:
  replicas: 2

  selector:
    matchLabels:
      app: status-monitor

  template:
    metadata:
      labels:
        app: status-monitor

    spec:
      containers:
        - name: status-monitor
          image: cloudlabhost/status-monitor:v1
          ports:
            - containerPort: 80